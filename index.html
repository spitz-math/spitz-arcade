<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spitz Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Racing+Sans+One&family=Pixelify+Sans:wght@600&family=Graduate&family=Righteous&family=Russo+One&family=Permanent+Marker&family=Lexend:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: arcade cabinet lobby. Step 1 pick a game (card grid), step 2 pick question set + topics, sticky launch bar. Single dark look to match the games. */
:root{
  --paper:#0E1016; --panel:#191C25; --panel2:#222634; --line:#2E3344;
  --ink:#F3F5FA; --muted:#9AA3B8; --brand:#FFB020; --ok:#7CE04A;
  --display:'Bungee', 'Arial Black', system-ui, sans-serif;
  --body:'Lexend', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  color-scheme:dark;
}
html,body{ background:var(--paper); color:var(--ink); }
body{ font:400 16px/1.5 var(--body); padding-inline:16px; padding-block:0 120px; }
.wrap{ max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:36px; }
header{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; padding-top:32px; }
h1{ font:400 clamp(34px,6vw,58px)/1 var(--display); margin:0; letter-spacing:.01em; }
h1 span{ color:var(--brand); }
.tag{ font:600 14px/1 var(--body); color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }
.proto{ font-size:14px; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:10px; padding:10px 14px; }
h2{ font:400 22px/1.1 var(--display); margin:0 0 14px; display:flex; gap:12px; align-items:center; }
h2 .n{ font:800 14px/1 var(--body); background:var(--brand); color:var(--paper); border-radius:99px; width:28px; height:28px; display:grid; place-items:center; }
.games{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.game{ all:unset; cursor:pointer; background:var(--gp); border:3px solid color-mix(in srgb,var(--acc) 22%,var(--line)); border-radius:18px; padding:10px 10px 14px; display:flex; flex-direction:column; gap:8px; transition:transform .12s, border-color .12s; }
.game:hover{ transform:translateY(-2px); }
.game:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
.game[aria-pressed="true"]{ border-color:var(--acc); box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 35%,transparent), 0 10px 30px color-mix(in srgb,var(--acc) 25%,transparent); }
.art{ display:block; width:100%; height:auto; aspect-ratio:200/110; border-radius:12px; overflow:hidden; background:var(--gpanel); }
.game b{ font:400 19px/1.1 var(--display); color:var(--acc); padding-inline:4px; }
.game small{ color:var(--muted); font-size:13px; padding-inline:4px; }
.game:hover{ border-color:color-mix(in srgb,var(--acc) 60%,var(--line)); }
.sets{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
.set{ background:var(--panel); border:3px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
.set.on{ border-color:var(--brand); }
.set label.head{ display:flex; gap:10px; align-items:center; font:800 18px/1.2 var(--body); cursor:pointer; }
.set .unit{ color:var(--muted); font-size:13px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ position:relative; }
.chip input{ position:absolute; opacity:0; }
.chip span{ display:block; padding:8px 12px; border-radius:99px; background:var(--panel2); border:2px solid var(--line); font-size:14px; font-weight:600; cursor:pointer; }
.chip input:checked + span{ background:var(--brand); color:var(--paper); border-color:var(--brand); }
.chip input:focus-visible + span{ outline:2px solid var(--ink); outline-offset:2px; }
.set:not(.on) .chips{ opacity:.45; }
input[type=radio]{ accent-color:var(--brand); width:18px; height:18px; }
.team{ background:var(--panel); border-radius:16px; padding:16px; color:var(--muted); font-size:15px; }
.team b{ color:var(--ink); }
.bar{ position:fixed; left:0; right:0; bottom:0; background:color-mix(in srgb,var(--paper) 92%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); }
.bar .in{ max-width:1100px; margin:0 auto; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
.sum{ min-width:0; flex:1 1 300px; }
.sum div{ font-weight:800; }
.sum code{ display:block; font:500 12px/1.4 var(--mono); color:var(--muted); overflow-wrap:anywhere; }
.play{ all:unset; cursor:pointer; font:400 22px/1 var(--display); background:var(--brand); color:var(--paper); padding:16px 30px; border-radius:14px; }
.play[disabled]{ opacity:.4; cursor:not-allowed; }
.play:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
.toast{ color:var(--ok); font-size:14px; }
@media (prefers-reduced-motion:reduce){ .game{ transition:none; } }

.set.off{ opacity:.45; }
.set.off label.head{ cursor:not-allowed; }
.soon{ font:600 12px/1 var(--body); color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
.chip input:disabled + span{ cursor:default; }
.teach{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.teach a{ color:var(--ink); background:var(--panel2); border:2px solid var(--line); border-radius:12px; padding:10px 14px; text-decoration:none; font-weight:600; }
.teach a:hover,.teach a:focus-visible{ border-color:var(--brand); }
a.play{ text-decoration:none; }
a.play[aria-disabled="true"]{ opacity:.4; pointer-events:none; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="tag">Made by Spitz 🍔</div>
      <h1>Spitz <span>Arcade</span></h1>
    </div>
    <p class="proto">Pick a game, then the questions you want to practice.</p>
  </header>

  <section>
    <h2><span class="n">1</span>Pick a game</h2>
    <div class="games" id="games"></div>
  </section>

  <section>
    <h2><span class="n">2</span>Pick your questions</h2>
    <div class="sets" id="sets"></div>
  </section>

</div>

<div class="bar">
  <div class="in">
    <div class="sum"><div id="sumtxt">Pick a game</div></div>
    <a class="play" id="play" href="#" aria-disabled="true">Play</a>
  </div>
</div>

<script>
var GAMES=[
  {id:'splat_range',name:'Splat Range',d:'Paint the targets',font:"'Lilita One'",paper:'#14110F',panel:'#211C19',acc:'#FF2E93',
   art:'<rect width="200" height="110" fill="#211C19"/><path d="M0 92h200v18H0z" fill="#2D2723"/>'+
   '<g transform="translate(118 50)"><circle r="34" fill="#FBF7F2"/><circle r="26" fill="#FF4B4B"/><circle r="18" fill="#FBF7F2"/><circle r="10" fill="#FF4B4B"/><circle r="4" fill="#FBF7F2"/></g>'+
   '<path d="M112 36c6-8 16-6 18 2 8-2 14 6 9 12 6 4 3 13-4 13-1 8-11 10-15 4-6 5-15 1-13-6-8-1-9-11-2-14-3-7 3-13 7-11z" fill="#B6FF3D"/>'+
   '<circle cx="146" cy="28" r="5" fill="#B6FF3D"/><circle cx="96" cy="70" r="4" fill="#B6FF3D"/><circle cx="150" cy="74" r="3" fill="#B6FF3D"/>'+
   '<path d="M104 60v14q0 5 3 5t3-5v-12zM126 62v22q0 5 3 5t3-5v-20z" fill="#B6FF3D"/>'+
   '<circle cx="52" cy="40" r="10" fill="#FF2E93"/><circle cx="32" cy="46" r="5" fill="#FF2E93" opacity=".6"/><circle cx="18" cy="50" r="3" fill="#FF2E93" opacity=".35"/>'+
   '<circle cx="40" cy="76" r="8" fill="#2DE2E6"/><circle cx="24" cy="80" r="4" fill="#2DE2E6" opacity=".6"/>'},
  {id:'star_swarm',name:'Star Swarm',d:'Blast the alien swarm',font:"'Bungee'",paper:'#03050C',panel:'#0A1122',acc:'#3DE0FF',
   art:'<rect width="200" height="110" fill="#03050C"/>'+
   '<g fill="#EAF6FF"><rect x="14" y="12" width="2" height="2"/><rect x="60" y="30" width="2" height="2"/><rect x="170" y="16" width="3" height="3"/><rect x="186" y="60" width="2" height="2"/><rect x="30" y="74" width="2" height="2"/><rect x="128" y="8" width="2" height="2"/></g>'+
   '<g fill="#FF4F6D"><rect x="40" y="16" width="20" height="8"/><rect x="36" y="20" width="4" height="8"/><rect x="60" y="20" width="4" height="8"/><rect x="44" y="24" width="4" height="4" fill="#03050C"/><rect x="52" y="24" width="4" height="4" fill="#03050C"/>'+
   '<rect x="136" y="26" width="20" height="8"/><rect x="132" y="30" width="4" height="8"/><rect x="156" y="30" width="4" height="8"/><rect x="140" y="34" width="4" height="4" fill="#03050C"/><rect x="148" y="34" width="4" height="4" fill="#03050C"/></g>'+
   '<rect x="98" y="34" width="4" height="22" fill="#A6FF4D"/>'+
   '<g fill="#3DE0FF"><rect x="96" y="62" width="8" height="8"/><rect x="92" y="70" width="16" height="8"/><rect x="84" y="78" width="32" height="8"/><rect x="80" y="86" width="8" height="8"/><rect x="112" y="86" width="8" height="8"/></g><rect x="96" y="90" width="8" height="10" fill="#FF9A2E"/>'},
  {id:'shift_racer',name:'Shift Racer',d:'Fuel up and race',font:"'Racing Sans One'",paper:'#0B0B0D',panel:'#17171B',acc:'#FFD60A',
   art:'<rect width="200" height="110" fill="#222228"/><rect x="0" y="0" width="22" height="110" fill="#17171B"/><rect x="178" y="0" width="22" height="110" fill="#17171B"/>'+
   '<g fill="#E8322E"><rect x="22" y="0" width="6" height="14"/><rect x="22" y="28" width="6" height="14"/><rect x="22" y="56" width="6" height="14"/><rect x="22" y="84" width="6" height="14"/><rect x="172" y="0" width="6" height="14"/><rect x="172" y="28" width="6" height="14"/><rect x="172" y="56" width="6" height="14"/><rect x="172" y="84" width="6" height="14"/></g>'+
   '<g fill="#F6F6F8"><rect x="22" y="14" width="6" height="14"/><rect x="22" y="42" width="6" height="14"/><rect x="22" y="70" width="6" height="14"/><rect x="172" y="14" width="6" height="14"/><rect x="172" y="42" width="6" height="14"/><rect x="172" y="70" width="6" height="14"/>'+
   '<rect x="98" y="2" width="4" height="16" opacity=".6"/><rect x="98" y="46" width="4" height="16" opacity=".6"/><rect x="98" y="90" width="4" height="16" opacity=".6"/></g>'+
   '<g transform="translate(62 18)"><rect x="-4" y="12" width="8" height="16" rx="2" fill="#0B0B0D"/><rect x="24" y="12" width="8" height="16" rx="2" fill="#0B0B0D"/><rect x="-4" y="54" width="8" height="16" rx="2" fill="#0B0B0D"/><rect x="24" y="54" width="8" height="16" rx="2" fill="#0B0B0D"/>'+
   '<rect x="0" y="4" width="28" height="74" rx="10" fill="#E8322E"/><rect x="4" y="26" width="20" height="16" rx="4" fill="#0B0B0D"/><rect x="11" y="4" width="6" height="74" fill="#FFD60A"/></g>'+
   '<path d="M120 80l10-58" stroke="#FFD60A" stroke-width="3"/><path d="M130 22h30v20h-30z" fill="#F6F6F8"/><path d="M130 22h10v10h-10zM150 22h10v10h-10zM140 32h10v10h-10z" fill="#0B0B0D"/>'},
  {id:'jump_man_multiplication',name:'Jump Man',d:'Climb the tower',font:"'Pixelify Sans'",paper:'#0D1A3A',panel:'#15295A',acc:'#FFC93C',
   art:'<rect width="200" height="110" fill="#5AA7F0"/><rect x="0" y="80" width="200" height="30" fill="#6B4A2B"/><rect x="0" y="78" width="200" height="6" fill="#7CE04A"/>'+
   '<rect x="20" y="58" width="50" height="8" rx="2" fill="#7CE04A"/><rect x="20" y="64" width="50" height="6" fill="#6B4A2B"/><rect x="120" y="22" width="56" height="8" rx="2" fill="#7CE04A"/><rect x="120" y="28" width="56" height="6" fill="#6B4A2B"/>'+
   '<g transform="translate(150 6)"><path d="M6 0l6 8-6 8-6-8z" fill="#FFC93C"/></g>'+
   '<g transform="translate(88 30)"><rect x="4" y="0" width="16" height="8" fill="#FFC93C"/><rect x="4" y="8" width="16" height="10" fill="#F2C29B"/><rect x="14" y="10" width="3" height="3" fill="#0D1A3A"/>'+
   '<rect x="2" y="18" width="20" height="14" fill="#3E6BC4"/><rect x="-4" y="16" width="6" height="6" fill="#F2C29B"/><rect x="22" y="12" width="6" height="6" fill="#F2C29B"/><rect x="2" y="32" width="8" height="10" fill="#15295A"/><rect x="14" y="30" width="8" height="8" fill="#15295A"/></g>'},
  {id:'football_buds',name:'Football Buds',d:'Four quarters vs the Rivals',font:"'Graduate'",paper:'#0A101E',panel:'#121B30',acc:'#E8344A',
   art:'<rect width="200" height="110" fill="#2E7D3A"/><g fill="#348A41"><rect x="0" y="0" width="40" height="110"/><rect x="80" y="0" width="40" height="110"/><rect x="160" y="0" width="40" height="110"/></g>'+
   '<g stroke="#F7F3E3" stroke-width="2" opacity=".85"><path d="M40 0v110M80 0v110M120 0v110M160 0v110"/></g>'+
   '<g fill="#F7F3E3" font-family="Graduate,serif" font-size="14" text-anchor="middle"><text x="40" y="104">20</text><text x="120" y="104">40</text></g>'+
   '<path d="M174 20v40M162 20h24M162 20v-14M186 20v-14" stroke="#FFC629" stroke-width="5" stroke-linecap="round" fill="none"/>'+
   '<g transform="translate(96 50) rotate(-25)"><ellipse rx="34" ry="20" fill="#8B4A22"/><path d="M-26 -8q26-12 52 0M-26 8q26 12 52 0" stroke="#F7F3E3" stroke-width="2.5" fill="none"/>'+
   '<path d="M-12 0h24" stroke="#F7F3E3" stroke-width="3"/><path d="M-8 -4v8M-2 -4v8M4 -4v8M10 -4v8" stroke="#F7F3E3" stroke-width="2.5"/></g>'},
  {id:'hoop_buds',name:'Hoop Buds',d:'First to 21',font:"'Righteous'",paper:'#0A0712',panel:'#160F24',acc:'#FF7A1A',
   art:'<rect width="200" height="110" fill="#160F24"/><path d="M0 90h200v20H0z" fill="#C9813F"/><path d="M0 90h200" stroke="#FFF6EE" stroke-width="2" opacity=".6"/>'+
   '<rect x="122" y="10" width="56" height="40" rx="3" fill="#FFF6EE"/><rect x="138" y="24" width="24" height="18" fill="none" stroke="#FF4B4B" stroke-width="3"/>'+
   '<rect x="134" y="48" width="32" height="5" rx="2" fill="#FF4B4B"/><path d="M136 53l6 22h16l6-22M142 53l4 22M150 53v22M158 53l-4 22M138 62h24" stroke="#FFF6EE" stroke-width="2" fill="none" opacity=".9"/>'+
   '<g transform="translate(70 42)"><circle r="24" fill="#FF7A1A"/><path d="M-24 0h48M0 -24v48M-17 -17q10 17 0 34M17 -17q-10 17 0 34" stroke="#0A0712" stroke-width="2.5" fill="none"/></g>'+
   '<path d="M96 24q18-16 34 2" stroke="#C07BFF" stroke-width="3" stroke-dasharray="5 5" fill="none"/>'},
  {id:'dash',name:'Dash',d:'Jump the spikes',font:"'Russo One'",paper:'#07070A',panel:'#111115',acc:'#C6FF00',
   art:'<rect width="200" height="110" fill="#1A2470"/><g fill="#2A3C86" opacity=".7"><rect x="10" y="14" width="26" height="26"/><rect x="150" y="8" width="34" height="34"/><rect x="96" y="28" width="16" height="16"/></g>'+
   '<rect x="0" y="80" width="200" height="30" fill="#060A1C"/><path d="M0 80h200" stroke="#C6FF00" stroke-width="3"/>'+
   '<path d="M122 80l12-24 12 24z" fill="#060A1C" stroke="#F3F7FF" stroke-width="3" stroke-linejoin="round"/><path d="M146 80l12-24 12 24z" fill="#060A1C" stroke="#F3F7FF" stroke-width="3" stroke-linejoin="round"/>'+
   '<g transform="translate(78 34) rotate(20)"><rect x="-16" y="-16" width="32" height="32" rx="2" fill="#FFD23F" stroke="#060A1C" stroke-width="3"/><rect x="-10" y="-10" width="20" height="20" fill="#2DE2E6"/><rect x="-6" y="-6" width="4" height="5" fill="#060A1C"/><rect x="3" y="-6" width="4" height="5" fill="#060A1C"/><rect x="-6" y="3" width="13" height="3" fill="#060A1C"/></g>'},
  {id:'skate',name:'Skate',d:'Land the tricks',font:"'Permanent Marker'",paper:'#100E18',panel:'#1B1A1F',acc:'#FF3EA5',
   art:'<defs><linearGradient id="sksky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A1F5C"/><stop offset=".7" stop-color="#FF4FA3"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient></defs>'+
   '<rect width="200" height="110" fill="url(#sksky)"/><circle cx="150" cy="64" r="22" fill="#FFD23F"/><g fill="#1B1A1F"><rect x="0" y="54" width="22" height="30"/><rect x="26" y="44" width="16" height="40"/><rect x="170" y="50" width="30" height="34"/></g>'+
   '<rect x="0" y="82" width="200" height="28" fill="#26242C"/>'+
   '<g transform="translate(92 52) rotate(-14)"><rect x="-38" y="-5" width="76" height="9" rx="4.5" fill="#C8FF3D" stroke="#100E18" stroke-width="2"/><path d="M-30 4v4M30 4v4" stroke="#B0ACC0" stroke-width="3"/><circle cx="-26" cy="12" r="6" fill="#F7F7F2" stroke="#100E18" stroke-width="2"/><circle cx="26" cy="12" r="6" fill="#F7F7F2" stroke="#100E18" stroke-width="2"/></g>'}
];
var SETS=[
  {id:'mult',name:'Multiplication facts',unit:'Times tables 0–12',topics:[['f03','Facts 0–3'],['f46','Facts 4–6'],['f79','Facts 7–9'],['f1012','Facts 10–12']]},
  {id:'slope',name:'Slope-intercept form',unit:'y = mx + b',topics:[['write','Write the equation'],['slope','Find the slope'],['yint','Find the y-intercept'],['graph','Read a graph']]},
  {id:'point',name:'Point-slope form',unit:'y − y₁ = m(x − x₁)',topics:[['write','Write the equation'],['point','Find the point'],['slope','Find the slope']]},
  {id:'hoy',name:'HOY & VUX',unit:'Horizontal and vertical lines',topics:[['describe','Describe the line'],['graph','Match the graph'],['slope','Find the slope']]},
  {id:'shift',name:'Linear transformations',unit:'Translating lines',topics:[['vs','Vertical shifts'],['hs','Horizontal shifts'],['gr','Graphs'],['ne','New equations']]}
];
var st={game:null,set:'mult',t:{}};
SETS.forEach(function(x){ st.t[x.id]=x.topics.map(function(t){ return t[0]; }); });
try{ var sv=JSON.parse(localStorage.getItem('spitz_hub2')||'null'); if(sv&&sv.t) SETS.forEach(function(x){ if(sv.t[x.id]) st.t[x.id]=sv.t[x.id]; }), st.game=sv.game||null, st.set=sv.set||'mult'; }catch(e){}
function $(i){ return document.getElementById(i); }
function save(){ try{ localStorage.setItem('spitz_hub2',JSON.stringify(st)); }catch(e){} }

$('games').innerHTML=GAMES.map(function(g){ return '<button class="game" style="--acc:'+g.acc+';--gp:'+g.paper+';--gpanel:'+g.panel+';--gf:'+g.font+', var(--display)" data-g="'+g.id+'" aria-pressed="false"><svg class="art" viewBox="0 0 200 110" aria-hidden="true">'+g.art+'</svg><b>'+g.name+'</b><small>'+g.d+'</small></button>'; }).join('');
$('sets').innerHTML=SETS.map(function(s){ return '<div class="set" data-s="'+s.id+'"><label class="head"><input type="radio" name="set" id="set-'+s.id+'" value="'+s.id+'"><span>'+s.name+'<br><span class="unit">'+s.unit+'</span></span></label><div class="chips">'+
  s.topics.map(function(t){ return '<label class="chip"><input type="checkbox" id="t-'+s.id+'-'+t[0]+'" data-s="'+s.id+'" value="'+t[0]+'"><span>'+t[1]+'</span></label>'; }).join('')+'</div></div>'; }).join('');

function gameOf(){ return GAMES.filter(function(x){ return x.id===st.game; })[0]; }
function render(){
  var g=gameOf();
  document.querySelectorAll('.game').forEach(function(b){ b.setAttribute('aria-pressed',b.dataset.g===st.game?'true':'false'); });
  document.querySelectorAll('.set').forEach(function(el){ var on=el.dataset.s===st.set; el.classList.toggle('on',on); el.querySelector('input[type=radio]').checked=on; });
  document.querySelectorAll('.chip input').forEach(function(c){ c.checked=st.t[c.dataset.s].indexOf(c.value)>=0; });
  var s=SETS.filter(function(x){ return x.id===st.set; })[0], ts=st.t[st.set], ok=g&&ts.length, p=$('play');
  p.setAttribute('aria-disabled',ok?'false':'true');
  p.href=ok?'games/'+g.id+'.html?set='+st.set+'&topics='+ts.join(','):'#';
  $('sumtxt').textContent=!g?'Pick a game':!ts.length?'Pick at least one topic':g.name+' · '+s.name+(ts.length<s.topics.length?' ('+ts.length+' of '+s.topics.length+' topics)':'');
}
$('games').addEventListener('click',function(e){ var b=e.target.closest('.game'); if(!b) return; st.game=b.dataset.g; save(); render(); });
$('sets').addEventListener('change',function(e){ var el=e.target;
  if(el.type==='radio'){ st.set=el.value; }
  else { var a=st.t[el.dataset.s]; if(el.checked){ if(a.indexOf(el.value)<0) a.push(el.value); } else st.t[el.dataset.s]=a.filter(function(v){ return v!==el.value; }); st.set=el.dataset.s; }
  save(); render(); });
render();
</script>
</body>
</html>
