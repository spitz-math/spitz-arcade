<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Up the Shot</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0C0E13; --panel:#171A22; --panel-2:#222733; --text:#F3F5F9; --muted:#9BA5B8; --border:#333A4B; --accent:#3D9BFF;
  --c-line:#FF5A5A; --c-m:#FFC53D; --c-b:#FF4FB8; --c-pt:#FFF35C; --c-ans:#C084FC; --ok:#4ADE80; --no:#FF7A7A;
  --display:'Sora','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--paper); overflow:hidden; }
body{ color:var(--text); font-family:var(--body); -webkit-user-select:none; user-select:none; touch-action:manipulation; }
#stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; padding:20px 40px 20px; display:grid; grid-template-rows:72px minmax(0,1fr) 104px; gap:14px; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; -webkit-tap-highlight-color:transparent; }
button:focus-visible{ outline:4px solid var(--accent); outline-offset:3px; }
.fr{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:.74em; line-height:1.08; margin:0 .1em; }
.fr>i{ font-style:normal; padding:0 .14em; } .fr>i:first-child{ border-bottom:.09em solid currentColor; }

/* top bar */
.top{ display:flex; align-items:center; gap:16px; white-space:nowrap; }
.top h1{ font:800 44px/1 var(--display); margin:0; letter-spacing:-.01em; }
.shotno{ font:800 26px/1 var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:16px 20px; border-radius:999px; background:var(--panel); border:2px solid var(--border); }
.top .sp{ flex:1; }
.nav{ min-width:76px; height:72px; padding:0 26px; border-radius:999px; background:var(--panel); border:2px solid var(--border); font:800 30px/1 var(--body); display:inline-flex; align-items:center; gap:12px; }
.nav:active{ background:var(--panel-2); }

/* main */
.main{ display:grid; grid-template-columns:760px minmax(0,1fr); gap:40px; min-height:0; }
.gwrap{ position:relative; width:760px; height:760px; align-self:center; }
.gwrap svg{ display:block; width:760px; height:760px; border-radius:26px; }
.gwrap::before{ content:""; position:absolute; inset:-14px; pointer-events:none; --c:rgba(255,255,255,.8);
  background:linear-gradient(var(--c),var(--c)) left top/64px 5px, linear-gradient(var(--c),var(--c)) left top/5px 64px, linear-gradient(var(--c),var(--c)) right top/64px 5px, linear-gradient(var(--c),var(--c)) right top/5px 64px,
    linear-gradient(var(--c),var(--c)) left bottom/64px 5px, linear-gradient(var(--c),var(--c)) left bottom/5px 64px, linear-gradient(var(--c),var(--c)) right bottom/64px 5px, linear-gradient(var(--c),var(--c)) right bottom/5px 64px; background-repeat:no-repeat; }
.gn{ font:700 24px var(--body); fill:var(--muted); }
.glab{ font:800 30px var(--body); paint-order:stroke; stroke:var(--panel); stroke-width:8px; stroke-linejoin:round; }
#shot{ stroke:var(--text); stroke-width:8; stroke-linecap:round; fill:none; }
#shot.good{ stroke:var(--c-ans); } #shot.bad{ stroke-dasharray:18 16; opacity:.9; }
#shot.draw{ animation:draw .9s cubic-bezier(.5,0,.2,1) both; }
@keyframes draw{ from{ stroke-dashoffset:var(--len); } to{ stroke-dashoffset:0; } }
#focus{ fill:none; stroke:var(--ok); stroke-width:6; opacity:0; }
#focus.on{ opacity:1; animation:snap .45s cubic-bezier(.2,1.6,.4,1) both; transform-box:fill-box; transform-origin:center; }
@keyframes snap{ from{ transform:scale(2.2); opacity:0; } to{ transform:scale(1); opacity:1; } }
#flash{ position:absolute; inset:0; border-radius:26px; background:#fff; opacity:0; pointer-events:none; }
#flash.go{ animation:flash .5s ease-out; }
@keyframes flash{ 0%{ opacity:.85; } 100%{ opacity:0; } }

.side{ display:grid; grid-template-rows:auto auto auto minmax(190px,1fr); gap:12px; min-height:0; min-width:0; }
.prompt{ background:var(--panel); border:2px solid var(--border); border-radius:26px; padding:14px 26px 16px; }
.mode{ display:inline-flex; align-items:center; gap:12px; padding:9px 20px; border-radius:999px; background:rgba(0,0,0,.55); border:2px solid color-mix(in srgb, var(--c-m) 55%, transparent); color:var(--c-m); font:800 26px/1 var(--display); letter-spacing:.07em; text-transform:uppercase; }
.mode svg{ width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.kind{ margin-left:16px; font:800 26px/1 var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.q{ margin:10px 0 0; font:700 38px/1.25 var(--display); }
.q .given{ color:var(--c-line); white-space:nowrap; } .q .pt{ color:var(--c-pt); white-space:nowrap; }

.entry{ display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:18px; min-height:0; }
.eqbox{ background:var(--panel); border:2px solid var(--border); border-radius:26px; padding:10px 24px; display:flex; flex-direction:column; justify-content:center; gap:8px; min-width:0; min-height:0; }
.eqrow{ display:flex; align-items:center; justify-content:center; gap:12px; font:800 52px/1 var(--display); white-space:nowrap; }
.fld{ min-width:96px; height:70px; padding:0 12px; border-radius:16px; background:var(--panel-2); border:3px solid var(--border); font:800 46px/64px var(--display); text-align:center; }
.fld.m{ color:var(--c-m); } .fld.b{ color:var(--c-b); min-width:108px; }
.fld.act{ border-color:var(--accent); box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 30%, transparent); }
.fld:empty::before{ content:"?"; color:var(--border); }
.mfrac{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.mfrac .bar{ width:112px; height:6px; border-radius:3px; background:var(--c-m); }
.sgn{ width:72px; height:70px; border-radius:16px; background:var(--panel-2); border:3px solid var(--border); font:800 48px/70px var(--display); }
.hint{ margin:0; text-align:center; font-size:26px; line-height:1.2; color:var(--muted); font-weight:500; }
.pad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.pad button{ height:60px; border-radius:16px; background:var(--panel); border:2px solid var(--border); font:800 38px/1 var(--display); }
.pad button:active{ background:var(--panel-2); transform:translateY(1px); }
.pad .wide{ grid-column:span 2; font-size:26px; }

.act3{ display:contents; }
.btns{ display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:14px; }
.big{ height:72px; border-radius:22px; font:800 32px/1 var(--display); letter-spacing:.04em; display:flex; align-items:center; justify-content:center; gap:16px; background:var(--panel); border:2px solid var(--border); }
.big:active{ transform:translateY(2px); }
.big.shoot{ background:#fff; color:#0C0E13; border-color:#fff; }
.big.shoot .ring{ width:50px; height:50px; border-radius:50%; border:6px solid #0C0E13; display:grid; place-items:center; } .big.shoot .ring::after{ content:""; width:26px; height:26px; border-radius:50%; background:#0C0E13; }
.big[disabled]{ opacity:.35; pointer-events:none; }
.verdict{ border-radius:22px; background:var(--panel); border:2px solid var(--border); padding:8px 26px; display:flex; flex-direction:column; justify-content:center; gap:0; min-height:0; overflow:hidden; }
.verdict .head{ font:800 38px/1.3 var(--display); } .verdict .head .fr{ font-size:.62em; } .verdict .line{ font-size:34px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.verdict.good{ border-color:var(--ok); } .verdict.good .head{ color:var(--ok); }
.verdict.bad{ border-color:var(--no); } .verdict.bad .head{ color:var(--no); }
.verdict .ans{ color:var(--c-ans); font-weight:800; }
.ok{ color:var(--ok); font-weight:800; } .no{ color:var(--no); font-weight:800; }

/* scoreboard */
.score{ display:flex; gap:12px; align-items:stretch; min-width:0; }
.team{ flex:1 1 0; min-width:0; display:grid; grid-template-columns:1fr auto; align-items:center; gap:6px; padding:8px 8px 8px 20px; border-radius:22px; background:var(--panel); border:3px solid var(--border); text-align:left; }
.team.sel{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--panel)); }
.team .nm{ font:800 26px/1.1 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.team.sel .nm{ color:var(--text); }
.team .sc{ font:800 46px/1 var(--display); }
.team .pm{ display:flex; flex-direction:column; gap:4px; }
.team .pm button{ width:72px; height:40px; border-radius:12px; background:var(--panel-2); border:2px solid var(--border); font:800 30px/1 var(--display); }
.tools{ flex:none; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:6px; width:300px; }
.tools button{ border-radius:14px; background:var(--panel); border:2px solid var(--border); font:800 24px/1 var(--body); }
.tools button:active{ background:var(--panel-2); }
.tools .rnd{ grid-column:span 2; background:var(--panel-2); font-size:26px; }
.nav.tl{ font-size:24px; padding:0 16px; gap:10px; color:var(--muted); }
.nav kbd{ font:800 22px/1 var(--body); padding:6px 10px; border-radius:8px; background:var(--panel-2); border:2px solid var(--border); color:var(--text); }
#confetti{ position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:18; pointer-events:none; }
.timer{ display:flex; align-items:center; gap:8px; margin-right:14px; }
.tadj{ width:60px; height:72px; border-radius:18px; background:var(--panel); border:2px solid var(--border); font:800 34px/1 var(--display); color:var(--muted); }
.tface{ height:72px; min-width:216px; padding:0 24px; border-radius:999px; background:var(--panel); border:3px solid var(--border); display:inline-flex; align-items:center; justify-content:center; gap:14px; font:800 46px/1 var(--display); font-variant-numeric:tabular-nums; color:var(--muted); }
.tface svg{ width:38px; height:38px; fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round; }
.timer.run .tface{ color:var(--text); border-color:var(--accent); }
.timer.low .tface{ color:var(--no); border-color:var(--no); }
.timer.done .tface{ background:var(--no); border-color:var(--no); color:#0C0E13; }
.toast{ position:absolute; left:50%; top:26px; transform:translateX(-50%); z-index:30; padding:16px 30px; border-radius:999px; background:#fff; color:#0C0E13; font:800 30px/1 var(--body); }
.toast[hidden]{ display:none; }
.win{ position:absolute; inset:0; z-index:15; background:rgba(8,9,13,.94); display:grid; place-items:center; }
.win[hidden]{ display:none; }
.winbox{ position:relative; width:1500px; padding:70px 90px 60px; text-align:center; }
.winbox>i{ position:absolute; width:96px; height:96px; border:6px solid rgba(255,255,255,.85); }
.winbox>i:nth-child(1){ left:0; top:0; border-right:0; border-bottom:0; } .winbox>i:nth-child(2){ right:0; top:0; border-left:0; border-bottom:0; }
.winbox>i:nth-child(3){ left:0; bottom:0; border-right:0; border-top:0; } .winbox>i:nth-child(4){ right:0; bottom:0; border-left:0; border-top:0; }
.wk{ margin:0; font:800 30px/1 var(--body); letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
.win h2{ margin:22px 0 34px; font:800 120px/1.05 var(--display); letter-spacing:-.01em; color:var(--c-ans); }
.wlist{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
.wrow{ min-width:190px; padding:18px 26px; border-radius:22px; background:var(--panel); border:3px solid var(--border); }
.wrow.lead{ border-color:var(--c-ans); background:color-mix(in srgb, var(--c-ans) 16%, var(--panel)); }
.wrow .n{ font:800 26px/1.1 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); } .wrow.lead .n{ color:var(--text); }
.wrow .p{ font:800 64px/1.1 var(--display); }
.wbtns{ display:flex; justify-content:center; gap:20px; margin-top:44px; } .wbtns .big{ padding:0 44px; }
#winflash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; } #winflash.go{ animation:flash .7s ease-out; }
.calc{ position:absolute; z-index:20; display:flex; flex-direction:column; background:var(--panel); border:3px solid var(--accent); border-radius:22px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.6); }
.calc[hidden]{ display:none; }
#p-nw{ left:1266px; top:14px; width:540px; height:1052px; }
#p-ds{ left:60px; top:60px; width:1800px; height:960px; }
.chead{ flex:none; height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 10px 0 26px; font:800 30px/1 var(--display); background:var(--panel-2); }
.cx{ width:72px; height:60px; border-radius:14px; font:800 44px/1 var(--display); background:var(--panel); border:2px solid var(--border); }
.cbody{ flex:1; min-height:0; position:relative; background:#fff; }
.cbody iframe{ position:absolute; left:0; top:0; border:0; transform-origin:0 0; }
@media (prefers-reduced-motion:reduce){ #flash.go, #winflash.go{ animation:none; } }
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <h1>Line Up the Shot</h1>
    <span class="shotno" id="shotno">Shot 1 of 10</span>
    <span class="sp"></span>
    <div class="timer" id="timer">
      <button class="tadj" id="tminus" aria-label="15 seconds less time per shot">−</button>
      <button class="tface" id="tface" aria-label="Start or pause the timer, key T"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="16"/><path d="M24 27V17M19 4h10M24 4v7"/></svg><span id="tnum">1:30</span></button>
      <button class="tadj" id="tplusb" aria-label="15 seconds more time per shot">+</button>
    </div>
    <button class="nav" id="prev" aria-label="Previous shot">‹ Back</button>
    <button class="nav" id="next" aria-label="Next shot">Next shot ›</button>
  </div>

  <div class="main">
    <div class="gwrap">
      <svg id="g" viewBox="0 0 760 760" role="img" aria-label="Coordinate graph"></svg>
      <div id="flash"></div>
    </div>

    <div class="side">
      <div class="prompt">
        <span class="mode" id="mode"></span><span class="kind" id="kind"></span>
        <p class="q" id="q"></p>
      </div>

      <div class="entry">
        <div class="eqbox">
          <div class="eqrow">
            <span>y =</span>
            <button class="sgn" id="msign" aria-label="Change the sign of the slope">+</button>
            <span class="mfrac"><button class="fld m act" id="f-num" aria-label="Slope numerator"></button><span class="bar"></span><button class="fld m" id="f-den" aria-label="Slope denominator"></button></span>
            <span>x</span>
            <button class="sgn" id="bsign" aria-label="Change the sign of b">+</button>
            <button class="fld b" id="f-b" aria-label="b"></button>
          </div>
          <p class="hint" id="hint">Tap a box, then type. Whole-number slope: leave the bottom box empty.</p>
        </div>
        <div class="pad" id="pad">
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" aria-label="Erase this box">⌫</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="sign" aria-label="Plus or minus">±</button>
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="0">0</button>
          <button class="wide" data-k="tab">Next box</button><button class="wide" data-k="clear">Clear all</button>
        </div>
      </div>

      <div class="act3">
        <div class="btns">
          <button class="big shoot" id="shoot"><span class="ring"></span>Take the shot</button>
          <button class="big" id="reveal">Show answer</button>
          <button class="big" id="retry">Clear shot</button>
        </div>
        <div class="verdict" id="verdict" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="score" id="score"></div>

  <canvas id="confetti" width="1920" height="1080" aria-hidden="true"></canvas>
  <div class="toast" id="toast" hidden></div>
  <div class="win" id="win" hidden>
    <div class="winbox"><i></i><i></i><i></i><i></i>
      <p class="wk">Final shot taken</p>
      <h2 id="winhead"></h2>
      <div class="wlist" id="winlist"></div>
      <div class="wbtns"><button class="big" id="winback">‹ Back to the game</button><button class="big shoot" id="winnew">New game</button></div>
    </div>
    <div id="winflash"></div>
  </div>
  <div class="calc" id="p-nw" hidden><div class="chead"><span>NumWorks</span><button class="cx" data-close aria-label="Close NumWorks">×</button></div><div class="cbody" id="nw-body"></div></div>
  <div class="calc" id="p-ds" hidden><div class="chead"><span>Desmos</span><button class="cx" data-close aria-label="Close Desmos">×</button></div><div class="cbody" id="ds-body"></div></div>
</div>

<script>
(function(){
'use strict';
// ---------- rounds: every answer checked by hand (b = y - m*x) ----------
// g = given line [num, den, b]; p = point; a = answer [num, den, b]; hide = don't plot the point until the shot (x-intercept rounds)
var R=[
 {t:'par', g:[2,1,1],   p:[3,2],   a:[2,1,-4]},
 {t:'per', g:[1,3,2],   p:[-2,3],  a:[-3,1,-3]},
 {t:'par', g:[-1,2,4],  p:[6,-5],  a:[-1,2,-2]},
 {t:'per', g:[-2,1,5],  p:[4,-1],  a:[1,2,-3]},
 {t:'par', g:[3,4,-6],  p:[-4,2],  a:[3,4,5]},
 {t:'per', g:[2,3,-1],  p:[-6,5],  a:[-3,2,-4]},
 {t:'par', g:[2,3,5],   p:[6,0],   a:[2,3,-4],  hide:true},
 {t:'per', g:[-4,1,-2], p:[8,6],   a:[1,4,4]},
 {t:'par', g:[-5,3,2],  p:[3,1],   a:[-5,3,6]},
 {t:'per', g:[4,1,3],   p:[-8,0],  a:[-1,4,-2], hide:true}
];
var ICON={par:'<svg viewBox="0 0 48 48"><rect x="6" y="6" width="26" height="26" rx="5"/><rect x="16" y="16" width="26" height="26" rx="5"/></svg>',
          per:'<svg viewBox="0 0 48 48"><path d="M40 24a16 16 0 1 1-6-12.5"/><path d="M35 3v10H25"/></svg>'};
var NS='http://www.w3.org/2000/svg', N=10, U=35, PAD=30, W=760;
function X(x){ return PAD+U*(x+N); } function Y(y){ return PAD+U*(N-y); }
function $(id){ return document.getElementById(id); }
function minus(n){ return String(n).replace('-','−'); }
function frac(n,d){ var s=n<0?'−':''; n=Math.abs(n); return d===1? s+n : s+'<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'; }
function eq(l){ var n=l[0], d=l[1], b=l[2]; var m=(d===1&&Math.abs(n)===1)?(n<0?'−':''):frac(n,d);
  return 'y = '+m+'x'+(b===0?'':(b<0?' − ':' + ')+Math.abs(b)); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a||1; }

// ---------- state ----------
var st={ i:0, teams:4, scores:[0,0,0,0,0,0,0,0], sel:0, solved:{}, f:{num:'',den:'',b:'',ms:1,bs:1}, act:'num' };
try{ var sv=JSON.parse(localStorage.getItem('lineup_shot_v2')||'null'); if(sv&&sv.scores){ st.teams=sv.teams||4; st.scores=sv.scores; st.i=Math.min(sv.i||0,R.length-1); st.solved=sv.solved||{}; } }catch(e){}
function save(){ try{ localStorage.setItem('lineup_shot_v2',JSON.stringify({teams:st.teams,scores:st.scores,i:st.i,solved:st.solved})); }catch(e){} }

// ---------- graph ----------
function el(tag,at,txt){ var e=document.createElementNS(NS,tag); for(var k in at) e.setAttribute(k,at[k]); if(txt!=null) e.textContent=txt; return e; }
function seg(n,d,b){ var m=n/d; return {x1:X(-N-1), y1:Y(m*(-N-1)+b), x2:X(N+1), y2:Y(m*(N+1)+b)}; }
function drawGraph(showPt){
  var r=R[st.i], g=$('g'); g.innerHTML='';
  var defs=el('defs',{}), cp=el('clipPath',{id:'box'}); cp.appendChild(el('rect',{x:PAD,y:PAD,width:U*2*N,height:U*2*N})); defs.appendChild(cp); g.appendChild(defs);
  g.appendChild(el('rect',{x:0,y:0,width:W,height:W,rx:26,fill:'var(--panel)'}));
  for(var i=-N;i<=N;i++){ g.appendChild(el('path',{d:'M'+X(i)+' '+Y(-N)+'V'+Y(N)+'M'+X(-N)+' '+Y(i)+'H'+X(N),stroke:'var(--border)','stroke-width':i%2?1.5:2.5})); }
  g.appendChild(el('path',{d:'M'+X(0)+' '+Y(-N)+'V'+Y(N)+'M'+X(-N)+' '+Y(0)+'H'+X(N),stroke:'var(--text)','stroke-width':4}));
  var lines=el('g',{'clip-path':'url(#box)'}); g.appendChild(lines);
  var s=seg(r.g[0],r.g[1],r.g[2]);
  lines.appendChild(el('line',{x1:s.x1,y1:s.y1,x2:s.x2,y2:s.y2,stroke:'var(--c-line)','stroke-width':7,'stroke-linecap':'round'}));
